<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SVM Explorer</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #101a39, #030410 75%);
      color: #f8fafc;
      font-family: "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 18px 26px;
      background: rgba(3, 8, 20, 0.95);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      margin: 0;
      font-size: 1.4rem;
      color: #38bdf8;
    }
    header a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.95rem;
      border-bottom: 1px dashed rgba(56,189,248,0.7);
    }
    main {
      flex: 1;
      padding: 24px;
      min-height: 0;
      display: flex;
    }
    #svm-root {
      flex: 1;
      min-height: 0;
    }
    footer {
      padding: 16px 26px 28px;
      font-size: 0.85rem;
      color: #94a3b8;
      border-top: 1px solid rgba(255,255,255,0.05);
      background: rgba(1, 5, 20, 0.75);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <header>
    <h1>SVM Explorer</h1>
    <a href="index.html">? Back to landing</a>
  </header>
  <main>
    <div id="svm-root"></div>
  </main>
  <footer>
    <span>Drag to add points, tune C, and switch tabs.</span>
    <span>Run from a local server (see README or `python -m http.server`).</span>
  </footer>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" data-presets="react" src="svm_explorer.browser.jsx"></script>
  <script type="text/babel">
    const svmRoot = document.getElementById('svm-root');
    if (svmRoot && window.SVMExplorer) {
      ReactDOM.createRoot(svmRoot).render(<SVMExplorer />);
    }
  </script>
</body>
</html>
