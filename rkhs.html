<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RKHS Explainer</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #0c1a3a, #00040a 70%);
      color: #f8fafc;
      font-family: "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 18px 26px;
      background: rgba(3, 8, 20, 0.9);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    header h1 {
      margin: 0;
      font-size: 1.4rem;
      color: #7dd3fc;
    }
    header a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.95rem;
      border-bottom: 1px dashed rgba(149, 208, 252, 0.8);
    }
    main {
      flex: 1;
      padding: 24px;
      display: flex;
      min-height: 0;
    }
    #rkhs-root {
      flex: 1;
      min-height: 0;
    }
    .status {
      max-width: 640px;
      padding: 18px 22px;
      border: 1px solid rgba(125,211,252,0.3);
      border-radius: 12px;
      background: rgba(12, 20, 36, 0.7);
      color: #cbd5f5;
      line-height: 1.6;
      font-size: 0.95rem;
    }
    .status strong { color: #7dd3fc; }
    footer {
      padding: 16px 26px 28px;
      font-size: 0.85rem;
      color: #94a3b8;
      border-top: 1px solid rgba(255,255,255,0.05);
      background: rgba(1, 5, 15, 0.7);
    }
  </style>
</head>
<body>
  <header>
    <h1>RKHS Explainer</h1>
    <a href="index.html">Back to landing</a>
  </header>
  <main>
    <div id="rkhs-root">
      <div class="status">
        <strong>Loading RKHS explainer…</strong><br>
        If this message stays, open your browser console to see which script failed.
      </div>
    </div>
  </main>
  <footer>
    <span>Interactive narrative powered by Emotionally expressive gradients.</span>
    <span>Serve via a local HTTP server to avoid file:// module issues.</span>
  </footer>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" data-presets="react" src="rkhs_explainer.browser.jsx"></script>
  <script type="text/babel">
    const root = document.getElementById('rkhs-root');

    if (!window.React || !window.ReactDOM) {
      root.innerHTML = '<div class="status"><strong>React failed to load.</strong><br>Check your internet connection or CDN blocking, then refresh.</div>';
    } else if (!window.RKHSExplainer) {
      root.innerHTML = '<div class="status"><strong>RKHS component not found.</strong><br>Make sure `rkhs_explainer.browser.jsx` loads without errors (see console).</div>';
    } else {
      ReactDOM.createRoot(root).render(<RKHSExplainer />);
    }
  </script>
</body>
</html>
